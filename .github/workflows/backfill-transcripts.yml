name: Backfill earnings transcripts

# Walks the Alerts-page ticker universe (DEFAULT_TICKERS, 85 names) and pulls the last
# four fiscal quarters of earnings-call transcripts into Mongo's normalized_transcripts,
# so the earnings-review skill can be pointed at any of them without a live fetch.
#
# Alpha Vantage's free tier allows 25 requests/day and the full job is ~340 requests, so
# one run cannot finish it. This runs daily and spends a 20-request budget each time,
# skipping whatever is already stored — roughly 17 days to complete, then it settles into
# topping up each ticker's newest quarter as companies report. Nothing is committed back:
# transcripts go to Mongo, and the fiscal-label cache is re-derived from SEC EDGAR (free,
# keyless) on every run.
#
# Once transcript coverage is complete this can be dropped to weekly, or left as-is — a
# run with nothing outstanding costs no Alpha Vantage requests at all.
#
# Required repository secrets:
#   MONGODB_URI, ALPHA_VANTAGE_API_KEY
# Optional: MONGODB_DB

on:
  schedule:
    # 09:20 UTC daily — after US earnings calls have been transcribed overnight, and well
    # clear of the report workflows so the two never contend for the same API quotas.
    - cron: '20 9 * * *'
  workflow_dispatch:
    inputs:
      budget:
        description: 'Max Alpha Vantage requests to spend this run'
        required: false
        default: '20'

concurrency:
  group: backfill-transcripts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm ci --omit=dev

      - name: Backfill transcripts
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: |
          node server/scripts/backfillAlertsTranscripts.js \
            --budget "${{ github.event.inputs.budget || '20' }}"
