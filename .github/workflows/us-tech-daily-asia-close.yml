name: US Tech Daily — Asia Close report

# Runs at 18:07 Asia/Hong_Kong every day (Korea/Taiwan/Japan/HK/China A-shares, just
# shut). Hong Kong is UTC+8 year-round, so 18:07 HKT is 10:07 UTC the same day — stable
# without daylight-saving adjustments. GitHub Actions cron is always UTC.
#
# Drives the .claude/skills/us-tech-daily/SKILL.md skill via Claude Code (through
# anthropics/claude-code-action), authenticated with an OAuth token tied to the account's
# Claude Pro/Max subscription (see "claude setup-token" — code.claude.com/docs) rather than
# a separate pay-per-token API key. The skill pulls prices/news, authors the narrative,
# lints every figure against the tape, renders the report, and publishes straight to
# MongoDB — MONGODB_URI puts the pipeline in Mongo mode (see us-tech-daily/store.py), so
# this run writes nothing to the repo.
#
# Required repository secrets:
#   CLAUDE_CODE_OAUTH_TOKEN — from `claude setup-token` (1-year lived; re-run yearly)
#   MONGODB_URI
# Optional:
#   MONGODB_DB
#   ALPHA_VANTAGE_API_KEY — unused for the asia kind, harmless if set (shared secret)

on:
  schedule:
    - cron: '7 10 * * *'
  workflow_dispatch:

concurrency:
  group: us-tech-daily-asia-close
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r us-tech-daily/requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/us-tech-daily asia-close"
          claude_args: "--max-turns 60"
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
