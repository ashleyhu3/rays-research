name: US Tech Daily — Asia Close report

# Requested for 16:30 Asia/Hong_Kong every day. Hong Kong is UTC+8 year-round, so 16:30
# HKT is 08:30 UTC the same day — stable without daylight-saving adjustments. GitHub
# Actions cron is always UTC.
#
# Every venue in the asia universe has settled by then: Taiwan 13:30 HKT, Japan 14:00 HKT,
# Korea 14:30 HKT, China A-shares 15:00 HKT, Hong Kong 16:00 plus a closing auction that
# ends 16:10.
#
# The slot used to be 18:07 HKT. GitHub's shared cron queue does not honour the requested
# minute — this repo's scheduled runs land 1-3h late (2026-08-04 fired +2h00, 2026-08-03
# +3h08, us-close +1h08), and 2026-08-05 was skipped outright. Asking earlier absorbs that
# queue delay: a punctual run publishes right after the HK close, a typical late one still
# lands around the old 18:00-19:30 HKT window instead of drifting past it.
#
# Drives the .claude/skills/us-tech-daily/SKILL.md skill via Claude Code (through
# anthropics/claude-code-action), authenticated with an OAuth token tied to the account's
# Claude Pro/Max subscription (see "claude setup-token" — code.claude.com/docs) rather than
# a separate pay-per-token API key. The skill pulls prices/news, authors the narrative,
# lints every figure against the tape, renders the report, and publishes straight to
# MongoDB — MONGODB_URI puts the pipeline in Mongo mode (see us-tech-daily/store.py), so
# this run writes nothing to the repo.
#
# Required repository secrets:
#   CLAUDE_CODE_OAUTH_TOKEN — from `claude setup-token` (1-year lived; re-run yearly)
#   MONGODB_URI
# Optional:
#   MONGODB_DB
#   ALPHA_VANTAGE_API_KEY — unused for the asia kind, harmless if set (shared secret)

on:
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch:

concurrency:
  group: us-tech-daily-asia-close
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r us-tech-daily/requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/us-tech-daily asia-close"
          claude_args: "--max-turns 200 --permission-mode bypassPermissions"
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
